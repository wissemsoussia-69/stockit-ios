name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public repository: no .env.sh / API keys are ever provided to CI. Integrations are compiled
  # empty, so test runs and published artifacts contain no secrets.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  tests:
    name: Tests (shared JVM + iOS simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Pick an available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          print(next(d["udid"] for d in devs if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"

      - name: Shared module tests (JVM)
        run: ./gradlew :shared:testAndroidHostTest --console=plain

      - name: Shared module tests (iOS simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test -Pstockit.iosSimulator="$SIMULATOR_ID" --console=plain

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/test-results/
          if-no-files-found: warn

  publish:
    name: Publish build artifact (unsigned)
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Archive StockIT (Release, unsigned)
        working-directory: iosApp
        run: |
          xcodebuild -project StockIT.xcodeproj -scheme StockIT -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StockIT.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/StockIT.xcarchive/Products/Applications/StockIT.app" "$RUNNER_TEMP/out/Payload/"
          (cd "$RUNNER_TEMP/out" && zip -qry "StockIT-unsigned-${GITHUB_SHA::7}.ipa" Payload && rm -rf Payload)
          shasum -a 256 "$RUNNER_TEMP"/out/*.ipa | tee "$RUNNER_TEMP/out/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: StockIT-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
